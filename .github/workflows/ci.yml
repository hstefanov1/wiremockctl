name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: sudo apt-get install -y shfmt shellcheck
      - name: Run pre-commit checks
        run: bash hooks/pre-commit
